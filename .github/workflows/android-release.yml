name: Signed Android APK
on:
  workflow_dispatch:
    inputs:
      rights_verified:
        description: Model rights and release authorization verified
        type: boolean
        required: true
        default: false
permissions:
  contents: write
jobs:
  build:
    if: inputs.rights_verified == true
    runs-on: ubuntu-latest
    env:
      PIC_AI_KEYSTORE_B64: ${{ secrets.PIC_AI_KEYSTORE_B64 }}
      PIC_AI_STORE_PASSWORD: ${{ secrets.PIC_AI_STORE_PASSWORD }}
      PIC_AI_KEY_ALIAS: ${{ secrets.PIC_AI_KEY_ALIAS }}
      PIC_AI_KEY_PASSWORD: ${{ secrets.PIC_AI_KEY_PASSWORD }}
      PIC_AI_CERT_SHA256: ${{ secrets.PIC_AI_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          for name in PIC_AI_KEYSTORE_B64 PIC_AI_STORE_PASSWORD PIC_AI_KEY_ALIAS PIC_AI_KEY_PASSWORD PIC_AI_CERT_SHA256; do
            test -n "${!name}" || { echo "Missing secret: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$PIC_AI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pic-ai-release.jks"
          echo "PIC_AI_KEYSTORE=$RUNNER_TEMP/pic-ai-release.jks" >> "$GITHUB_ENV"
      - run: python3 tools/bootstrap.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64 --build-number "$((GITHUB_RUN_NUMBER+10000))"
      - name: Verify APK certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          TOOL=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $TOOL"
          CERTS=$("$TOOL" verify --print-certs "$APK")
          echo "$CERTS" | grep -i "SHA-256" || true
          ACTUAL=$(echo "$CERTS" | grep -iE '(Signer #1|Signer):? certificate SHA-256 digest:' | head -1 | sed 's/.*SHA-256 digest: //' | tr -cd '0-9a-fA-F' | tr 'A-F' 'a-f')
          EXPECTED=$(printf '%s' "$PIC_AI_CERT_SHA256" | tr -cd '0-9a-fA-F' | tr 'A-F' 'a-f')
          echo "actual length: ${#ACTUAL}, expected length: ${#EXPECTED}"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK signer certificate does not match PIC_AI_CERT_SHA256"
            exit 1
          fi
          echo "Certificate OK"
      - uses: actions/upload-artifact@v4
        with:
          name: PIC_AI-android-arm64-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          BUILD=$((GITHUB_RUN_NUMBER+10000))
          TAG="v${VERSION}-build${BUILD}"
          cp build/app/outputs/flutter-apk/app-release.apk PIC_AI.apk
          gh release create "$TAG" PIC_AI.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PIC_AI ${VERSION} (build ${BUILD})" \
            --notes "正式簽章 APK（arm64，小米 MIX 2 / Android 9+）。可直接覆蓋安裝舊版，不需移除。"
      - if: always()
        run: rm -f "$RUNNER_TEMP/pic-ai-release.jks"
